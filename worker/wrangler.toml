name = "kalender-api"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Tageslimit-Speicher für den Foto-Import (KV).
# id nach `npx wrangler kv namespace create RATE_LIMIT` einsetzen.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_ID"

# Secrets (setzen via `npx wrangler secret put ANTHROPIC_API_KEY`, nicht hier):
# - ANTHROPIC_API_KEY
