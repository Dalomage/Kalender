name = "kalender-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# Rate-Limit-Speicher (KV). ID nach `wrangler kv:namespace create RATE_LIMIT` einsetzen.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_ID"

# Secrets (setzen via `wrangler secret put ANTHROPIC_KEY`, nicht hier):
# - ANTHROPIC_KEY

# Optional: eigene Subdomain unter kalenderkaiser.pages.dev
# (Custom Domain im Dashboard einstellen; Standard-URL ist
#  https://kalender-api.<dein-cf-subdomain>.workers.dev)
