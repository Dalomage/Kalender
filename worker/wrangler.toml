name = "kalender-api"
main = "worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Tageslimit-Speicher für den Foto-Import (KV).
# id nach `npx wrangler kv namespace create RATE_LIMIT` einsetzen.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "ab6d7848c844436b9eadf36422c521ad"

# Cloudflare Workers AI für den Foto-Import (10.000 Neuronen/Tag kostenlos;
# im Workers-Free-Tarif bei Überschreitung Fehler statt Kosten)
[ai]
binding = "AI"
