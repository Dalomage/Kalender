<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Hintergrund für maskable icon: sichere Zone ist Radius ~205 vom Zentrum -->
  <rect width="512" height="512" fill="#0f1419"/>
  <!-- Kalenderblatt -->
  <g transform="translate(96 112)">
    <!-- Papier -->
    <rect x="0" y="24" width="320" height="288" rx="28" ry="28" fill="#f1f5f9"/>
    <!-- Header (Teal) -->
    <rect x="0" y="24" width="320" height="72" rx="28" ry="28" fill="#14b8a6"/>
    <rect x="0" y="60" width="320" height="36" fill="#14b8a6"/>
    <!-- Ringe -->
    <rect x="72" y="0" width="18" height="52" rx="6" fill="#0d9488"/>
    <rect x="230" y="0" width="18" height="52" rx="6" fill="#0d9488"/>
    <!-- Datumsraster -->
    <g fill="#94a3b8">
      <rect x="40"  y="128" width="36" height="36" rx="6"/>
      <rect x="94"  y="128" width="36" height="36" rx="6"/>
      <rect x="148" y="128" width="36" height="36" rx="6"/>
      <rect x="202" y="128" width="36" height="36" rx="6"/>
      <rect x="256" y="128" width="36" height="36" rx="6"/>

      <rect x="40"  y="180" width="36" height="36" rx="6"/>
      <rect x="94"  y="180" width="36" height="36" rx="6"/>
      <rect x="202" y="180" width="36" height="36" rx="6"/>
      <rect x="256" y="180" width="36" height="36" rx="6"/>

      <rect x="40"  y="232" width="36" height="36" rx="6"/>
      <rect x="94"  y="232" width="36" height="36" rx="6"/>
      <rect x="148" y="232" width="36" height="36" rx="6"/>
      <rect x="202" y="232" width="36" height="36" rx="6"/>
    </g>
    <!-- "Heute" markiertes Feld in Teal -->
    <rect x="148" y="180" width="36" height="36" rx="8" fill="#14b8a6"/>
    <!-- Herz-Akzent im markierten Feld: gemeinsamer Kalender-Vibe -->
    <path d="M 166 210 l -6 -6 a 4 4 0 0 1 6 -5 a 4 4 0 0 1 6 5 z" fill="#fff"/>
  </g>
</svg>
